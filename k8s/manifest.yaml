---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server-deployment
  labels:
    app: llama-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      containers:
        - name: llama-server
          image: my-llama-server:v1
          imagePullPolicy: Never
          args:
            - "-m"
            - "/data/Llama3-8.0B-Q4_K_M.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "-c"
            - "4096"
            - "-np"
            - "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "6Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: model-volume
              mountPath: /data
              readOnly: true
      volumes:
        - name: model-volume
          hostPath:
            path: /models
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: llama-server-service
  labels:
    app: llama-server
spec:
  type: NodePort
  selector:
    app: llama-server
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
